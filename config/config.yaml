    strategy_pnl_sizing:
      enabled: true
      lookback_hours: 168       # last 7 days
      min_sample: 3
      # 2026-05-29: lowered strong threshold 5.0 -> 3.0. After the size cuts,
      # absolute weekly PnL shrank, so winners rarely cleared +$5/168h and never
      # reached the strong (full-size) tier. +$3 keeps the bar meaningful while
      # letting proven winners (swing_hull_rsi_ema) earn full size again.
      strong_pnl_threshold: 3.0
      normal_pnl_threshold: 0.0
      strong_multiplier: 1.0
      normal_multiplier: 0.7
      probation_multiplier: 0.4
      # Phase B (2026-05-29): floor the compounded size multiplier for strong-tier
      # strategies so caution / regime / trend-chase penalties cannot starve a
      # strategy that is carrying the book. Concentrates capital into winners.
      winner_floor_multiplier: 0.6
