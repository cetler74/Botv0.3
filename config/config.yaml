  strategy_expectancy_guard:
    enabled: true
    lookback_days: 7
    min_closed_trades: 5
    min_total_pnl_usd: 0.0
    strategy_min_total_pnl_usd:
      # Allow small negative recent sample so one mild 5-trade probe does not
      # completely starve the only currently firing long-only spot entry.
      rsi_stoch_reversal_15m: -1.0
    cache_seconds: 300
    probation_size_multiplier: 0.50
    # 2026-06-21: spot was frozen (0 entries/24h) because the guard HARD-BLOCKS
    # recently-negative strategies, while perps only size them down (adaptive
    # control). Widen the probation loss floor from -$1 to -$8 so the shared
    # long-only playbooks trade at reduced size (not blocked) until a 7d loss
    # circuit-breaker trips. Mirrors the perp size-down-and-keep-sampling model.
    probation_max_negative_pnl_usd: 8.0
    probation_size_multiplier_by_strategy: {}
    probation_max_negative_pnl_usd_by_strategy: {}
    # Recent-negative => probation size instead of hard block. These mirror the
    # perp specialist/standalone playbooks so spot behaves like perps (soft
    # size-down) rather than freezing out long-only entries entirely.
    probation_size_strategies:
    - dual_sma_daytrade
    - rsi_stoch_reversal_15m
    - supply_demand_3step
    probation_exempt_strategies: []
    allow_unproven_strategies:
    - rsi_oversold_checklist
    - weekly_fibonacci_spot
  adaptive_position_sizing:
    enabled: true
    lookback_trades: 20
    consecutive_loss_threshold: 2
    reduced_size_multiplier: 0.35
    min_size_multiplier: 0.25
    strategy_min_multipliers:
      sma_reclaim_bull_flag: 0.85
  # Stagnant loser: exit when age+no meaningful bounce+loss — pre-empts SL slippage on thin books.
  # 2026-05-19: tighter — exit ~-0.8% when peak < 0.3% (swing_hull was bleeding to -1.2%+).
  stagnant_loser:
    min_age_minutes: 25
    # Below profit_protection activation (0.6%): failed-to-arm trades exit ~-0.75% not full SL.
    peak_cap_pct: 0.55
    loss_trigger_pct: -0.65
    # Never-armed chop (peak ~0%): exit earlier than standard stagnant (DOGS-style).
    no_mfe_fast_fail_enabled: true
    no_mfe_peak_pct: 0.03
    no_mfe_min_age_minutes: 10
    no_mfe_loss_pct: -0.40
    fast_fail_peak_pct: 0.15
    fast_fail_min_age_minutes: 10
    fast_fail_loss_pct: -0.40
    volatility_reference_pct: 0.80
    peak_cap_slope: 0.35
    loss_trigger_slope: 0.45
    min_age_floor_minutes: 20
    min_age_ceiling_minutes: 45
    # Setup-stop playbooks exit at John Wick SL only — no pre-emptive stagnant exit.
    disabled_strategies:
    - arc_daytrade
  # Per-strategy spot exit overrides (orchestrator _check_trade_exit).
  # Global trailing_stop / profit_protection remain defaults for other strategies.
  exit_profiles:
    weekly_fibonacci_spot:
      strategies:
        - weekly_fibonacci_spot
      use_setup_stops: true
      use_setup_targets: true
      stagnant_loser_enabled: false
      max_holding_minutes: 10080
      take_profit_pct: 0
      trailing_stop:
        enabled: false
      profit_protection:
        enabled: false
    arc_daytrade:
      strategies:
        - arc_daytrade
      stagnant_loser_enabled: false
      use_setup_targets: false
      max_holding_minutes: 180
      trailing_stop:
        # Arm below global 1.8% so winners lock before wick-SL chop (NEAR winner +1.59%).
        activation_threshold: 0.0100
        # Wide callback — let intraday runners extend; tighten only after +1.5% peak.
        step_percentage: 0.0040
        dynamic_tightening_enabled: true
        tighten_profit_threshold: 0.0150
        tightened_step_percentage: 0.0025
        breakeven_floor_percentage: 0.0070
        min_trigger_distance_percentage: 0.0070
      profit_protection:
        enabled: true
        # Arm before trail — lock fee+ floor on first peak without partial clipping.
        activation_threshold: 0.0080
        guaranteed_min_profit: 0.0070
        break_even_plus: 0.0070
  execution_slippage:
    alert_threshold_bps: 35
    downgrade_threshold_bps: 60
    downgrade_cooldown_minutes: 120
  regime_policies:
    policy_version: "2026-05-20-v2"
    mode: "enforce"   # shadow | enforce | calibrate
    defaults:
