strategy_manager:
  analysis_timeout: 30
  max_concurrent_analyses: 10
  signal_cache_duration: 300
trading:
  # PnL-FIX v3 — concurrency limits
  # Previously 150 → 32 concurrent correlated longs were a single big crypto-long bet,
  # not 32 independent trades. Hard-cap concurrency to a real diversification budget.
  max_concurrent_trades: 12  # PnL-FIX v3: was 150
  # PnL-FIX v5 — Emergency kill-switches were tripping immediately on a clean
  # slate. The previous values (0.2% daily loss, 1 consecutive loss, 90% win
  # rate, 1% total loss) were panic settings while the strategy bugs were
  # being patched. Now that the v3/v4/v5 strategy fixes are in, restore
  # statistically-meaningful thresholds so a normal ‑1R drawdown can't
  # freeze the entire bot.
  max_daily_loss: 0.030             # PnL-FIX v5: was 0.002 — 3% daily loss cap (≈ realistic 1-day worst case)
  max_daily_trades: 100
  win_rate_threshold: 0.40          # PnL-FIX v5: was 0.90 — kill-switch only on chronic <40% win rate
  consecutive_loss_limit: 5         # PnL-FIX v5: was 1 — 5 in a row signals real strategy drift, not noise
  min_confidence_threshold: 0.45    # PnL-FIX v3: was 0.30 — match higher signal quality
  max_total_loss: 0.10              # PnL-FIX v5: was 0.01 — 10% account drawdown is the actual stop-the-bot line
  max_trades_per_exchange: 15       # was 5 — higher per-venue cap while max_concurrent_trades caps total risk
  setup_memory:
    enabled: true
    mode: blocking  # advisory | size_down | blocking
    include_shadow: true
    lookback_days: 90
    min_real_samples: 5
    min_shadow_episodes: 10
    recent_loss_cooldown_hours: 4
    exact_setup_loss_streak_block: 2
    block_expectancy_below: 0.0
    block_profit_factor_below: 0.8
    caution_profit_factor_below: 1.1
    caution_win_rate_below: 0.45
    size_down_multiplier: 0.5
    closed_trade_fetch_limit: 1000
    spot:
      enabled: true
      include_shadow: false
      min_real_samples: 2
      block_all_loss_cohorts: true
      broad_all_loss_min_samples: 4
      block_negative_expectancy_broad: true
    perps:
      enabled: true
      include_shadow: true
      closed_trade_fetch_limit: 1000

  # PnL-FIX v3 — Per-pair cooldown + correlation cap (enforced by orchestrator)
  # `pair_cooldown_minutes`: minimum minutes between consecutive entries on the
  # same pair. Prevents the bot from stacking correlated longs on the same pair
  # within a single cycle (root cause of the 32-concurrent-losers episode).
  # `correlation_basket_cap`: max concurrent longs on USD/USDT/USDC-quoted pairs
  # per exchange (enforced by orchestrator).
  # Since crypto longs correlate >0.8, treating them as one basket is realistic.
  pair_cooldown_minutes: 45
  # Global cross-exchange cooldown for the same base asset (cluster): ALGO/USD and ALGO/USDC
  # share key ALGO. Example: DOGE/USDC on cryptocom blocks DOGE/USD on binance for 5 minutes.
  global_pair_cooldown_minutes: 5
  # Block stacking: do not open while any OPEN row for the same base on any venue has weak uPnL
  # (prevents twin ALGO loads across ALGO/USD vs ALGO/USDC).
  block_new_entry_if_open_unrealized_negative: true
  # Hard guard: if this pair closed with realized loss in the last N hours, block re-entry.
  block_pair_after_negative_realized_enabled: true
  # Deprecated: duration now comes from trading.pair_rotation.loss_scaled_cooldown tiers.
  block_pair_after_negative_realized_hours: 12
  # Block new entries when latest close on pair has realized PnL% below this threshold.
  # Example 0.5 => blacklist on losses and small gains below +0.5%.
  # Block re-entry when latest close realized PnL% is below this (0 = any net loss).
  block_pair_after_realized_pnl_below_pct: 0.0
  # Allow stacking same base cluster only when all open legs for that base are above this uPnL%.
  # Example 0.5 => block new entries if any open ALGO/* leg is <= +0.5%.
  block_new_entry_if_open_unrealized_below_pct: 0.5
  # Max concurrent OPEN rows per base cluster across all venues (ALGO/* counts together).
  max_open_trades_per_pair: 1
  # Block if there is already >=1 active trade on the same base anywhere (ALGO/USD + ALGO/USDC).
  force_single_open_per_pair: true
  # Block new entries only after this many underwater opens on the same cluster (Layer 1).
  pair_risk_layer1_min_negative_positions_to_block: 2
  # Block new entries when combined loss-shaped events (open loss + closed loss in 2h) reach this count (Layer 2).
  pair_risk_layer2_min_loss_events: 2
  # Apply extended post-exit cooldown only after this many consecutive realized-loss closes.
  pair_consecutive_losses_for_extended_cooldown: 2
  pair_loss_extended_cooldown_minutes: 90
  correlation_basket_cap: 12
  # Monthly realized PnL goal (USD) for /monthly-profit dashboard
  monthly_profit_target_usd: 1000
  min_exchange_balance: 50.0
  # Spot setup-target exits ignore targets below this % (prevents $0.20 clips on $200).
  min_setup_target_pct: 0.012
  # PnL-FIX v13 (2026-05): raise floor so typical spot notionals are not "fee-dominated"
  # (min fixed fee / small $80–$100 orders → net-red exits even with a green tick).
  # Measured rule of thumb: keep min order high enough that 2× taker% + slippage is
  # a small fraction of the expected MFE; pair with breakeven_floor + activation below.
  min_order_size_usd:
    cryptocom: 200.0
    binance: 200.0
    bybit: 200.0
    default: 200.0
  default_min_order_amount: 0.001  # Fallback minimum order amount in crypto units (INCREASED: Prevent micro-orders)
  sanitization:
    prevent_zero_rounding: true
    min_crypto_precision: 8
    max_crypto_precision: 12
  risk_reward_minimum: 2.0
  mode: simulation
  # PnL-FIX v9 — Simulation accounting (single source of truth)
  # The dashboard's per-exchange balance is now DERIVED from these values
  # plus SUM(realized_pnl) per exchange, eliminating dual-ledger drift.
  # `fee_rate_per_side` is the fallback applied on every simulated entry AND exit.
  # `fee_rate_per_side_by_exchange` overrides it for spot maker-style accounting.
  simulation:
    starting_balance_per_exchange_usd: 2000.0
    fee_rate_per_side: 0.001
    fee_rate_per_side_by_exchange:
      binance: 0.001
      cryptocom: 0.00075
      bybit: 0.001
      default: 0.001
  hyperliquid_perps:
    # Parallel perpetual paper engine. Uses live Hyperliquid market prices and
    # HL-native strategy forks (strategies_hyperliquid), not spot mirrors.
    enabled: true
    mode: paper
    signal_source: hyperliquid_strategies
    # Exit sweep can consume most of the perp timebox and starve signal prefetch
    # (observed 0/40 and partial 15/41 misses). Timebox exits; give entry a fresh budget.
    perp_exit_max_seconds: 12
    perp_entry_cycle_seconds: 75
    signal_prefetch:
      timeout_seconds: 25
      retries: 2
      retry_delay_seconds: 0.4
      inline_fallback: true
      max_prefetch_seconds: 50
      entry_evaluation_reserve_seconds: 15
    strategy_consensus:
      min_agreement: 50
      min_confidence_long: 0.64
      min_confidence_short: 0.68
    # Perpetual paper exits are position-close decisions, not opposite entry
    # signals. Keep exits centralized in stop loss / trailing profit protection
    # so a short entry is never confused with a spot-style sell signal.
    use_strategy_exits: false
    # Dedicated HL venue equity (separate from spot starting_balance_per_exchange_usd).
    starting_balance_usd: 5000.0
    wallet_address: "${HYPERLIQUID_WALLET_ADDRESS}"
    # Hyperliquid maker fee assumption for this account: 0.010% per side.
    fee_rate_per_side: 0.00010
    allow_live_orders: false
    # Manual live pilot (rsi_stoch only). Set mode: live + allow_live_orders: true after
    # scripts/check_hl_live_readiness.py passes and ./scripts/apply_config.sh.
    live_strategy_allowlist:
      - rsi_stoch_reversal_15m
    live_max_margin_per_trade: 25
    live_max_open_positions: 2
    live_kill_switch: false
    live_promotion:
      enabled: false
      strategy: rsi_stoch_reversal_15m
      min_closed_trades: 30
      lookback_hours: 168
      min_realized_pnl_usd: 25.0
      min_profit_factor: 1.2
      min_win_rate: 0.52
      max_consecutive_losses: 4
      require_positive_last_24h: true
      # Offline walk-forward must approve the strategy/version before live pilot.
      require_validation_manifest: true
    default_leverage: 2.0
    adaptive_leverage:
      enabled: true
      min: 1.0
      max: 5.0
      default: 2.0
      tight_stop_max_pct: 0.60
      medium_stop_max_pct: 1.25
      wide_stop_min_pct: 2.0
      # Strategy caps reflect setup speed and stop behavior. Leverage only
      # reduces collateral; risk-sized notional is never increased by it.
      strategy_overrides:
        supply_demand_3step: {min: 1.0, max: 3.0, default: 2.0}
        ema50_breakout_pullback: {min: 1.0, max: 3.0, default: 2.0}
        rsi_stoch_reversal_15m: {min: 1.0, max: 5.0, default: 3.0}
        swing_hull_rsi_ema: {min: 1.0, max: 3.0, default: 2.0}
        arc_daytrade: {min: 1.0, max: 3.0, default: 2.0}
        sma_reclaim_bull_flag: {min: 1.0, max: 3.0, default: 2.0}
    # Paper sizing: margin is the collateral locked; notional is exposure.
    # Target full paper-balance deployment across the 20-pair HL universe.
    # At 2x, $250 margin opens a $500 paper position.
    max_margin_per_trade: 250.0
    # Execution viability is fee/edge-aware below. Keep the legacy hard floor
    # disabled so adaptive risk reductions can produce valid smaller positions.
    min_notional_per_trade: 0.0
    max_notional_per_trade: 500.0
    # Paper experiment: once an entry passes every quality/risk gate, use a
    # deterministic position size. Adaptive multipliers remain observable but
    # no longer turn accepted paper trades into $25-$150 positions.
    fixed_paper_notional:
      enabled: true
      target_usd: 500.0
    dynamic_notional_gate:
      enabled: true
      # Absolute exchange/order safety floor; unlike strategy floors this does
      # not scale down with adaptive sizing.
      exchange_min_notional_usd: 10.0
      # Default floor and expected-net-profit target both scale with the final
      # position multiplier (for example, a 0.35 risk reduction).
      minimum_viable_notional_usd: 40.0
      min_expected_net_profit_usd: 0.25
      fallback_min_notional_usd: 50.0
      max_dynamic_min_notional_usd: 200.0
      strategy_overrides:
        supply_demand_3step:
          minimum_viable_notional_usd: 50.0
          min_expected_net_profit_usd: 0.25
        ema50_breakout_pullback:
          minimum_viable_notional_usd: 60.0
          min_expected_net_profit_usd: 0.30
        rsi_stoch_reversal_15m:
          minimum_viable_notional_usd: 40.0
          min_expected_net_profit_usd: 0.20
        swing_hull_rsi_ema:
          minimum_viable_notional_usd: 50.0
          min_expected_net_profit_usd: 0.25
        arc_daytrade:
          minimum_viable_notional_usd: 50.0
          min_expected_net_profit_usd: 0.25
        sma_reclaim_bull_flag:
          minimum_viable_notional_usd: 60.0
          min_expected_net_profit_usd: 0.30
    max_open_positions: 15
    strategy_open_position_limits:
      # Do not let the improved EMA50 long lane consume the expanded 15-position book.
      ema50_breakout_pullback: 4
      # 2026-06-23 review: shadow supply_demand_3step long/trending_up was the
      # strongest missed cohort (+$98.54 over 45 closed shadow opportunities).
      # Give it enough room to scale proven long lanes without letting one
      # playbook consume the whole 15-position paper book.
      supply_demand_3step: 2
      arc_daytrade: 3
    # Counterfactual strategy evaluation. These positions use fixed notional and
    # are accounting-excluded, so they never affect portfolio PnL, margin, risk
    # halts, adaptive controls, or normal open-position limits.
    shadow_strategy_evaluation:
      enabled: true
      notional_size: 200.0
      leverage: 1.0
      max_open_positions: 500
      # One live counterfactual per strategy/coin/side. A new setup can re-arm
      # after the prior position closes, while its stable setup fingerprint
      # prevents the same zone/candle episode from being counted again.
      single_open_per_strategy_coin_side: true
    # Promote strong shadow cohorts into the executable scan universe. This
    # does not open trades by itself; the current live signal must still match
    # and pass all normal paper-entry gates. Episode-adjusted review (2026-06-23)
    # showed the durable edge is coin-specific (e.g. XYZ:NATGAS ema50 long/sideways),
    # not global supply_demand long/trending_up raw-row totals.
    shadow_cohort_promotion:
      enabled: true
      lookback_hours: 72
      fetch_limit: 1000
      max_candidates: 10
      # Eight independent episodes plus positive train/holdout, PF and winner
      # concentration checks admit validated paper cohorts without reopening a
      # broad strategy/regime lane.
      min_closed: 8
      min_episodes: 8
      use_episode_metrics: true
      min_win_rate: 0.55
      min_realized_pnl_usd: 5.0
      min_profit_factor: 1.25
      require_positive_holdout: true
      max_winner_contribution: 0.35
      # Additive cross-strategy score when live coin/strategy/side/regime matches
      # a promoted cohort — favors NATGAS-style ema50 without global bias inflation.
      selection_boost: 0.40
      strategies:
        - supply_demand_3step
        - supertrend
        - rsi_stoch_reversal_15m
        - swing_hull_rsi_ema
      sides:
        - long
        - short
      regimes:
        - trending_up
        - trending_down
        - breakout
        - high_volatility
      require_promotion_for:
        # 2026-06-28 bidirectional perp review: shorts are profitable in specific
        # regime/strategy lanes (arc counter-trend, supertrend downtrend, vwma
        # trending_down). Require coin-specific shadow proof per lane — not a
        # blanket short block.
        # 2026-06-23: supply_demand_3step long/trending_up is only profitable
        # when it is the shadow-proven promoted cohort (mostly XYZ:MSTR). The
        # same lane on non-promoted coins, especially FARTCOIN, was negative in
        # the last 24h. Require a coin-specific promoted cohort before execution.
        - strategy: supply_demand_3step
          side: long
          regimes:
            - trending_up
            - breakout
            - high_volatility
        - strategy: supertrend
          side: short
          regimes:
            - trending_down
            - high_volatility
        - strategy: supply_demand_3step
          side: short
          regimes:
            - trending_down
            - high_volatility
        # 2026-07-10: unlock standalone trending_up / high_volatility longs for
        # the 15m RSI/Stoch lane (commented intent). Keep promotion only on the
        # mixed/negative chop and breakout long regimes; shorts in trending_up
        # still need coin-specific proof.
        - strategy: rsi_stoch_reversal_15m
          side: long
          regimes:
            - reversal_zone
            - sideways
            - breakout
        - strategy: rsi_stoch_reversal_15m
          side: short
          regimes:
            - trending_up
    lane_notional_multipliers: {}
    # Hard deny known toxic coin/strategy lanes even if other gates pass.
    coin_strategy_entry_denies:
      - strategy: breakout_retest_long
      - strategy: rsi_stoch_reversal_1m
      - strategy: heikin_ashi
      - strategy: vwap_bounce_scalping
      - strategy: orb_5m_scalp
      - strategy: pullback_long_scalping
      - coin: XRP
      - coin: XYZ:MSTR
      - coin: XYZ:SMSN
      - coin: FARTCOIN
        strategy: supply_demand_3step
        sides:
          - long
      - coin: EIGEN
        strategy: ema50_breakout_pullback
      - coin: WLD
        strategy: breakout_retest_long
      - coin: WLD
        strategy: vwma_hull
      - coin: XPL
        strategy: ema50_breakout_pullback
      - coin: NEAR
        strategy: vwma_hull
        sides:
          - short
    # rsi_stoch must not win via consensus fallback when standalone is quiet.
    consensus_executable_denylist:
      - rsi_stoch_reversal_15m
      - rsi_stoch_reversal_5m
      - rsi_stoch_reversal_1m
    mids_websocket:
      enabled: true
      url: wss://api.hyperliquid.xyz/ws
      fresh_seconds: 20
    min_confidence_long: 0.64
    min_confidence_short: 0.68
    # 2026-05-26: re-entry cooldown after ANY exit on same coin+side (not just losses).
    # 2026-05-31: 30 -> 45 after 24h review — stagnant-loser churn on repeat coin+side entries.
    perp_reentry_cooldown_minutes: 45
    strategy_pair_stop_cooldown:
      enabled: true
      cooldown_hours: 6
      stop_exit_reason_keywords:
      - stop_loss
      - loss_cap
      - loss_recovery_expired
      - stagnant_loser
      - no_mfe
    high_volatility_strategy_controls:
      ema50_breakout_pullback:
        enabled: false
        size_multiplier: 0.50
    good_entry_size_scaling:
      enabled: true
      require_executable_requalification: true
      # Only apply extra size on coin-specific promoted cohort matches.
      promoted_cohort_multiplier: 1.25
      min_confidence: 0.78
      min_strength: 0.72
      min_reward_risk: 0.0
      multiplier: 1.20
      max_multiplier: 1.35
      strategies:
        ema50_breakout_pullback:
          min_confidence: 0.80
          min_strength: 0.72
          min_reward_risk: 2.0
          multiplier: 1.15
    # Block good-entry / promoted size boosts until executable paper stats requalify.
    executable_size_requalification:
      enabled: true
      min_closed_trades: 30
      min_span_days: 14
      min_profit_factor: 1.25
      min_realized_pnl_usd: 0.0
    # Phase 4 (2026-05-27): session-aware sizing/blocking driven by lifetime
    # paper PnL distribution per UTC hour:
    #   worst: 13 (-$24.33), 21 (-$21.80), 19 (-$15.94), 2 (-$14.88), 4 (-$13.89)
    #   best:  20 (+$13.03), 23 (+$4.20), 16 (+$3.66), 8 (+$3.11), 0 (+$2.05)
    # Replaces the original 10–12 UTC window from the 2026-05-26 spec, which
    # did not match the observed hour-of-day loss pattern.
    session_sizing:
      enabled: true
      caution_multiplier: 0.5
      caution_windows:
        - start_utc: 2
          end_utc: 5      # thin Asia chop
        - start_utc: 13
          end_utc: 15     # US session entry chop
        - start_utc: 19
          end_utc: 22     # US close / Asia open vacuum
      # 2026-06-23: keep session awareness as sizing/caution only. Hard UTC
      # blocks were starving executable perps after the entry gate tightening,
      # while shadow diagnostics still need live executable sampling.
      block_windows_enabled: false
      # The versioned 15m exhaustion setup uses its own strict
      # RSI/StochRSI gate decide instead of suppressing it by broad hour blocks.
      block_window_exempt_strategies:
        - rsi_stoch_reversal_15m
      # Structural playbooks can opt out of evening scalp caution.
      caution_window_exempt_strategies:
        - ema50_breakout_pullback
        - supply_demand_3step
        - dual_sma_daytrade
        - arc_daytrade
