alerts:
  channels:
    database: true
    email: false
    webhook: false
  enabled: true
  thresholds:
    api_error: 5
    balance_low: 50
    daily_loss: 0.05
    trade_failure: 3
monitoring:
  prometheus:
    scrape_interval_seconds: 15
    retention_hours: 200
  alerts:
    telegram_enabled: true
    balance_low_usd: 50
    daily_loss_fraction: 0.05
    perp_paper_loss_usd_24h: 500
    no_trades_for_minutes: 30
    redis_stream_max_length: 10000
    cpu_percent: 80
    memory_percent: 80
    disk_percent: 85
    postgres_connections_percent: 80
    postgres_db_max_size_gb: 10
    postgres_cache_hit_ratio_min: 0.90
balance_manager:
  check_interval_seconds: 30
  max_balance_usage: 0.9
  min_balance_threshold: 10
database:
  host: postgres
  max_overflow: 20
  name: trading_bot_futures
  options: -c search_path=trading,public
  password: mypassword
  pool_size: 10
  port: 5432
  user: carloslarramba
database_manager:
  backup_interval_hours: 24
  connection_timeout: 30
  max_retries: 3
  query_timeout: 60
exchange_manager:
  max_retries: 3
  rate_limit_delay: 0.1
  request_timeout: 30
  retry_delay: 1
exchanges:
  binance:
    base_currency: USDC
    market_type: spot
    # 2026-06-14: cap active spot scan until strategy-service OHLCV fanout is
    # optimized. Larger universes were timing out before entry decisions.
    max_pairs: 8
    min_volatility: 0.02
    min_volume_24h: 1000000
    sandbox: false
    websocket_url: wss://stream.binance.com:9443/ws/!ticker@arr
    websocket_private: wss://stream.binance.com:9443/ws
  bybit:
    base_currency: USDC
    market_type: spot
    max_pairs: 8
    min_volatility: 0.015
    min_volume_24h: 500000
    sandbox: false
    websocket_url: wss://stream.bybit.com/v5/public/spot
    websocket_private: wss://stream.bybit.com/v5/private
  cryptocom:
    base_currency: USD
    market_type: spot
    max_pairs: 8
    min_volatility: 0.005
    min_volume_24h: 500000
    sandbox: false
    websocket_url: wss://stream.crypto.com/v2/market
    websocket_private: wss://stream.crypto.com/v2/user
logging:
  backup_count: 5
  file: logs/trading_bot.log
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  max_file_size: 10485760
mcp:
  enabled: true
  perplexity:
    api_key: ''
    base_url: https://api.perplexity.ai
    cache:
      enabled: true
      max_size: 1000
      ttl_seconds: 3600
    features:
      news_analysis: true
      real_time_data: true
      web_scraping: true
      web_search: true
    max_retries: 3
    rate_limit_delay: 1.0
    scraping_settings:
      include_images: false
      include_links: true
      max_content_length: 50000
      timeout: 15
    search_settings:
      exclude_domains: []
      include_domains: []
      max_results: 10
      search_type: web
    timeout: 30
pair_selector:
  # SCALPING-OPTIMIZED PAIR SELECTION CONFIGURATION
  update_interval_minutes: 15  # Real-time updates for scalping (15min optimal)
  max_pairs_per_exchange: 15
  
  # Enhanced scoring weights for scalping
  scoring_weights:
    liquidity_score: 0.25      # Intraday liquidity (new)
    spread_tightness: 0.25     # Spread analysis (enhanced)
    volatility_suitability: 0.20  # Moderate volatility (enhanced)
    performance_metrics: 0.20  # Historical performance (new)
    volume_24h: 0.10           # Daily volume (reduced weight)
  
  # Scalping-optimized selection criteria
  selection_criteria:
    # Intraday liquidity requirements
    min_volume_1h: 100000      # Minimum 1-hour volume
    min_volume_15m: 25000      # Minimum 15-minute volume
    min_volume_5m: 10000       # Minimum 5-minute volume
    min_order_book_depth: 5000 # Minimum order book depth
    
    # Spread requirements (critical for scalping)
    max_spread_percentage: 0.5  # Maximum 0.5% spread for scalping
    max_spread_1h_avg: 0.3     # Maximum 1-hour average spread
    min_spread_consistency: 70  # Minimum spread consistency score
    
    # Advanced Order Book Requirements
    min_order_book_levels: 10   # Minimum number of order book levels
    max_order_book_imbalance: 2.0  # Maximum bid/ask volume imbalance ratio
    min_order_book_stability: 80   # Minimum order book stability score
    min_depth_at_0_1pct: 10000     # Minimum depth within 0.1% of mid price
    min_depth_at_0_5pct: 50000     # Minimum depth within 0.5% of mid price
    max_slippage_1000_usd: 0.1     # Maximum slippage for $1000 order
    min_liquidity_score: 75        # Minimum overall liquidity score
    
    # Volatility requirements (moderate volatility for scalping)
    min_volatility_15m: 0.2    # Minimum 15-minute volatility
    max_volatility_15m: 5.0    # Maximum 15-minute volatility
    optimal_volatility_range: [0.5, 3.0]  # Sweet spot for scalping
    min_volatility_consistency: 60  # Minimum volatility consistency
    
    # Execution requirements
    max_slippage_threshold: 0.3  # Maximum acceptable slippage
    min_execution_success_rate: 95  # Minimum execution success rate
    max_execution_time: 2.0     # Maximum execution time in seconds
    
    # Performance requirements
    min_win_rate: 60           # Minimum historical win rate
    min_profit_factor: 1.2     # Minimum profit factor
    max_drawdown: 10.0         # Maximum acceptable drawdown
    
    # Legacy criteria (maintained for compatibility)
    min_volume_24h: 2000000
    min_volatility: 0.015
    max_volatility: 0.08
    min_market_cap: 500000000
  
  # Enhanced blacklist system
  # Never select stablecoin / fiat-pegged base assets (e.g. EUR/USDC, USDE/USDC).
  exclude_stablecoin_bases: true
  stablecoin_base_assets:
  - USDT
  - USDC
  - USDE
  - DAI
  - BUSD
  - TUSD
  - FDUSD
  - PYUSD
  - USDD
  - FRAX
  - LUSD
  - GUSD
  - USDP
  - USD1
  - RLUSD
  - USN
  - USTC
  - SUSD
  - CUSD
  - USDJ
  - USDK
  - USDS
  - USDX
  - EUR
  - EURS
  - EURI
  - AEUR
  - EURC
  - EURT
  - GBP
  - JPY
  - AUD
  - CAD
  - SGD
  - TRY
  - BRL
  - PAX
  # PnL-FIX v10 (2026-04-20): Blacklist driven by 7-day PnL review.
  #   Repeat losers (>=2 trades, net -PnL):
  #     ONT/USDC   -$5.81  (2 trades, both losses)
  #     TRX/USDC   -$3.46  (2 trades, 1 SL@-1.58%)
  #     CHZ/USDC   -$1.48  (2 trades, net negative)
  #   Low-liquidity cryptocom small-caps causing SL overshoot (-3% to -5%
  #   exits on a -1.5% stop — market sell slippage on thin order books):
  #     AAVE/USD, API3/USD, ACT/USD, ARC/USD, ACS/USD
  #   Other cryptocom alphabetical-selector pollution (selector falls back
  #   to alphabetic order when ccxt `info.quoteVolume` is missing — these
  #   are the lowest-liquidity pairs showing up in analysis but unfit for
  #   spot scalping). Keeping as comments for audit; uncomment to enforce.
  blacklisted_pairs:
  - U/USDC   # 2026-06-14: strategy-service returns 404 for binance UUSDC.
  - OP/USDC  # 2026-06-14: strategy-service returns 404 for bybit OPUSDC.

  # 2026-05-21 48h review: sub-cent Bybit DOGS scalper entry had 0.00% MFE
  # and closed as stagnant_loser at -1.59% net. Pair guards now block it, and
  # this blacklist keeps it out of rotation if stale config is running.
  # - ACX/USD
  # - ADI/USD
  # - AERGO/USD
  # - AERO/USD
  # - AEVO/USD
  # - AGENTFUN/USD
  # - AGLD/USD
  # - AIOZ/USD
  # - AIXBT/USD
  # - AKT/USD
  # - ALCX/USD
  # ACH/USD
  # CRO/USD removed for pair-specific optimization implementation
  # BNB/USDC  # EMERGENCY: Recent losses
  # XLM/USDC  # EMERGENCY: Recent losses
  
  # Enhanced replacement selection
  replacement_selection:
    enabled: true
    min_volume_24h_multiplier: 1.5
    min_market_cap_multiplier: 1.2
    exclude_new_listings_days: 28  # Extended to 4 weeks for stability
    min_listing_age_days: 30       # Minimum listing age for stability
    stability_check_enabled: true  # Enable stability checks
  
  # Performance tracking configuration
  performance_tracking:
    enabled: true
    metrics_retention_days: 90     # Keep 90 days of performance data
    trade_history_limit: 1000      # Keep last 1000 trades per pair
    update_frequency_minutes: 5    # Update performance metrics every 5 minutes
    min_trades_for_analysis: 10    # Minimum trades needed for analysis
  
  # Real-time monitoring
  real_time_monitoring:
    enabled: true
    liquidity_check_interval: 60   # Check liquidity every minute
    spread_check_interval: 30      # Check spreads every 30 seconds
    volatility_check_interval: 120 # Check volatility every 2 minutes
    performance_update_interval: 300 # Update performance every 5 minutes
redis:
  db: 0
  host: trading-bot-redis  # FIXED: Changed from localhost to Docker service name
  max_connections: 20
  password: ''
  port: 6379
# EXCHANGE-SPECIFIC MARKET CONDITIONS
# Generic market conditions optimized for each exchange's characteristics
exchange_specific_configs:
  binance:
    # Binance: World's largest exchange - $133B volume, 34% market share, superior liquidity
    market_conditions:
      # Volume patterns (based on $32B daily volume, 411 coins, 1493 pairs)
      volume_patterns:
        min_volume_24h: 50000000        # Higher threshold for Binance's massive liquidity
        volume_spike_threshold: 2.5     # Strong volume spikes on major pairs
        volume_ma_periods: 20           # Longer periods for stable volume analysis
        min_volume_consistency: 0.8     # High consistency on liquid markets
        volume_surge_multiplier: 3.5    # Binance shows strong institutional volume surges
        min_sustainable_volume: 30000000 # Higher minimum for trend sustainability
        
      # Volatility profiles (optimized for major pairs: BTC, ETH, SOL, etc.)
      volatility_profiles:
        min_atr_threshold: 0.01         # Higher baseline for major crypto volatility
        max_atr_threshold: 0.08         # Account for crypto market volatility
        volatility_ma_periods: 14       # Standard periods for crypto analysis
        volatility_spike_multiplier: 2.5 # Strong volatility spikes on news
        bollinger_band_period: 21       # Slightly longer for stable signals
        volatility_breakout_threshold: 0.02 # Clear breakout detection
        
      # Technical indicators (optimized for USDC pairs trading)
      technical_indicators:
        adx_threshold: 22               # PnL-FIX v3: was 15 (chop). Restored crypto-trending baseline to allow more trading opportunities
        adx_trending_threshold: 50      # Strong trending confirmation
        rsi_overbought: 75             # Standard overbought for crypto
        rsi_oversold: 25               # Standard oversold levels
        bb_squeeze_threshold: 0.02      # Tighter for breakout detection
        confluence_required: 3          # Higher confidence for major pairs
        macd_signal_strength: 0.003     # Sensitive to momentum changes
        volume_rsi_threshold: 70        # Volume momentum threshold
        
      # Market microstructure (Binance-specific characteristics)
      microstructure:
        tick_size_adjustment: 0.00001   # Fine granularity for USDC pairs
        spread_tolerance: 0.0008        # Tight spreads on liquid pairs
        order_book_depth: 15            # Deep order books on major pairs
        price_precision: 5              # High precision for USDC pairs
        min_order_size_usd: 150.0        # Binance minimum order size (INCREASED: Prevent micro-order interference)
        min_order_quantity: 50          # Quantity-based minimums
        liquidity_depth_levels: 20      # Deep market depth analysis
        market_impact_threshold: 0.0005 # Low market impact on liquid pairs

  bybit:
    # Bybit: 2nd largest exchange - derivatives focus, 60M+ users, $44B futures volume
    market_conditions:
      # Volume patterns (based on $5B spot, $44B futures volume)
      volume_patterns:
        min_volume_24h: 25000000        # Lower than Binance but substantial
        volume_spike_threshold: 3.0     # Higher spikes due to derivatives activity
        volume_ma_periods: 16           # Responsive to futures-driven moves
        min_volume_consistency: 0.75    # Good consistency on major pairs
        volume_surge_multiplier: 4.0    # Strong derivatives-driven surges
        min_sustainable_volume: 15000000 # Moderate sustainability threshold
        
      # Volatility profiles (derivatives-influenced volatility)
      volatility_profiles:
        min_atr_threshold: 0.012        # Higher due to derivatives influence
        max_atr_threshold: 0.15         # Much higher ceiling for leverage effects
        volatility_ma_periods: 12       # Faster response to derivatives moves
        volatility_spike_multiplier: 3.0 # Strong leverage-driven volatility
        bollinger_band_period: 18       # Shorter for derivatives responsiveness
        volatility_breakout_threshold: 0.025 # Higher threshold for true breakouts
        
      # Technical indicators (derivatives-optimized)
      technical_indicators:
        adx_threshold: 22               # PnL-FIX v3: was 15 (chop). Restored crypto-trending baseline to allow more trading opportunities
        adx_trending_threshold: 48      # Strong trending with leverage
        rsi_overbought: 80             # Higher - leverage can extend moves
        rsi_oversold: 20               # Lower - leverage can extend drops
        bb_squeeze_threshold: 0.018     # Adjusted for derivatives volatility
        confluence_required: 2          # Lower - derivatives move faster
        macd_signal_strength: 0.004     # More sensitive for derivatives
        volume_rsi_threshold: 65        # Lower threshold for faster signals
        
      # Market microstructure (Bybit derivatives-focused)
      microstructure:
        tick_size_adjustment: 0.0001    # Standard crypto precision
        spread_tolerance: 0.0012        # Slightly wider spreads
        order_book_depth: 12            # Good depth for major pairs
        price_precision: 4              # Standard USDC precision
        min_order_size_usd: 25.0        # Bybit minimum orders (INCREASED: Prevent micro-order interference)
        min_order_quantity: 75          # Moderate minimums
        liquidity_depth_levels: 15      # Good depth analysis
        market_impact_threshold: 0.0008 # Slightly higher impact

  cryptocom:
