    # per-trade size by 0.4 / 0.7 / 1.0 based on rolling realized PnL on
    # closed paper trades for that strategy. Independent of standalone gate
    # size_multipliers — they compound.
    #
    # Paper-to-live promotion whitelist (preliminary, refresh from
    # scripts/report_hl_paper_pnl.py before flipping any strategy to live):
    #   - swing_hull_rsi_ema       (lifetime +$6.47, 66.7% WR, PF 2.38)
